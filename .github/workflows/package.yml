name: Package

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Qt 6 (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript

      - name: Build (release)
        run: cargo build --release

      - name: Package .deb
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi

          mkdir -p pkg/DEBIAN pkg/usr/bin

          sed "s/@VERSION@/$VERSION/g" packaging/deb/control > pkg/DEBIAN/control

          install -m 755 target/release/wallpapersearcher pkg/usr/bin/

          dpkg-deb --build pkg
          mkdir -p dist
          mv pkg.deb "dist/wallpapersearcher_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: wallpapersearcher-deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Qt 6 + rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            rpm

      - name: Build (release)
        run: cargo build --release

      - name: Package .rpm
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi

          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS,SRPMSBUILD}
          sed "s/@VERSION@/$VERSION/g" packaging/rpm/wallpapersearcher.spec > rpmbuild/SPECS/wallpapersearcher.spec

          cp target/release/wallpapersearcher rpmbuild/SOURCES/

          rpmbuild \
            --define "_topdir ${PWD}/rpmbuild" \
            --define "_sourcedir ${PWD}/rpmbuild/SOURCES" \
            -bb rpmbuild/SPECS/wallpapersearcher.spec

          mkdir -p dist
          find rpmbuild/RPMS -name '*.rpm' -exec mv {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: wallpapersearcher-rpm
          path: dist/*.rpm

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install KDE SDK and rust extension
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --system flathub org.kde.Sdk//6.10 org.kde.Platform//6.10

      - name: Build inside KDE SDK
        run: |
          mkdir -p /tmp/flatpak-cargo /tmp/flatpak-rustup
          BUILD_DIR="flatpak-build"

          flatpak build-init "$BUILD_DIR" \
            org.anythingdevteam.wallpapersearcher \
            org.kde.Sdk org.kde.Platform 6.10

          flatpak build --share=network \
            --bind-mount=/run/cargo=/tmp/flatpak-cargo \
            --bind-mount=/run/rustup=/tmp/flatpak-rustup \
            --bind-mount=/run/build="$PWD" \
            "$BUILD_DIR" /bin/bash -e -c '
              export CARGO_HOME=/run/cargo RUSTUP_HOME=/run/rustup
              export PATH="$CARGO_HOME/bin:$PATH"
              if ! command -v rustc &>/dev/null; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
                . "$CARGO_HOME/env"
              fi
              cd /run/build
              cargo build --release
              install -Dm755 target/release/wallpapersearcher /app/bin/wallpapersearcher
              install -Dm644 flatpak/org.anythingdevteam.wallpapersearcher.desktop \
                /app/share/applications/org.anythingdevteam.wallpapersearcher.desktop
              install -Dm644 flatpak/org.anythingdevteam.wallpapersearcher.metainfo.xml \
                /app/share/metainfo/org.anythingdevteam.wallpapersearcher.metainfo.xml
              install -Dm644 flatpak/icons/hicolor/scalable/apps/org.anythingdevteam.wallpapersearcher.svg \
                /app/share/icons/hicolor/scalable/apps/org.anythingdevteam.wallpapersearcher.svg
            '

          flatpak build-finish "$BUILD_DIR" \
            --share=network --share=ipc \
            --socket=fallback-x11 --socket=wayland \
            --filesystem=home

          flatpak build-export flatpak-repo "$BUILD_DIR" stable
          flatpak build-bundle flatpak-repo wallpapersearcher.flatpak org.anythingdevteam.wallpapersearcher stable

      - uses: actions/upload-artifact@v4
        with:
          name: wallpapersearcher-flatpak
          path: wallpapersearcher.flatpak
